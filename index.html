<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IMPRIMATUR</title>
<link rel="icon" type="image/png" href="icons/favicon-512.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500&family=Inter:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=14">
</head>
<body>

<div class="stage">
  <div class="rail">
    <div class="menu-btn" aria-hidden="true">
      <span class="cross-mark">
        <span class="cross-layer cross-layer--light"></span>
        <span class="cross-layer cross-layer--dark"></span>
        <span class="cross-layer cross-layer--main"></span>
      </span>
    </div>
    <div class="rail-label">Marginalia</div>
  </div>

  <div class="main">
    <div class="opening">
      <div class="mobile-bar">
        <div class="menu-btn" aria-hidden="true">
          <span class="cross-mark">
            <span class="cross-layer cross-layer--light"></span>
            <span class="cross-layer cross-layer--dark"></span>
            <span class="cross-layer cross-layer--main"></span>
          </span>
        </div>
        <div class="mobile-marginalia">Marginalia</div>
      </div>
      <hr class="mobile-rule">

      <div class="top-row">
        <h1 class="headline">IMPRIMATUR</h1>
      </div>

      <div class="shelf-spacer shelf-spacer--top" aria-hidden="true"></div>
      <div class="shelf-wrap">
        <div id="shelf" class="shelf"></div>
        <p class="hint">hover over a spine to reveal its cover &middot; click the cover to read the accompanying essay</p>

        <section id="review-panel" class="review-panel" hidden>
          <button id="review-close" class="review-close" aria-label="Close review">&times;</button>
          <div id="review-content" class="review-content"></div>
        </section>
      </div>
      <div class="shelf-spacer shelf-spacer--bottom" aria-hidden="true"></div>
    </div>

    <footer class="site-footer">
      <div class="bottom-block">design inspired by <a href="https://josefchladek.com/index/20" target="_blank" rel="noopener">josefchladek.com</a></div>
    </footer>
  </div>
</div>

<script src="data/config.js?v=1"></script>
<script src="js/data-loader.js?v=1"></script>
<script src="js/app.js?v=1"></script>
</body>
</html>
